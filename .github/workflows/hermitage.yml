name: Hermitage Mt Cook availability

on:
  # 正式排程在確認查房流程可行後才加入（每天一次）
  workflow_dispatch:
    inputs:
      mode:
        description: "diag=診斷（存畫面與網路紀錄）、check=正式查房"
        required: false
        default: "diag"
      test_email:
        description: "只寄一封測試信（不查房）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Check Hermitage availability
        env:
          MODE: ${{ inputs.mode }}
          TEST_EMAIL: ${{ inputs.test_email }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python check_hermitage.py
      - name: Publish debug files to branch hermitage-debug
        if: always()
        run: |
          # 診斷結果（公開的飯店網頁畫面與網路紀錄，不含任何密碼）存到獨立分支方便查看
          [ -d debug ] || exit 0
          cp -r debug /tmp/dbg
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan hermitage-debug
          git rm -rf . > /dev/null 2>&1 || true
          cp -r /tmp/dbg/. .
          git add -A
          git commit -m "hermitage debug ${GITHUB_RUN_ID}" || exit 0
          git push -f origin hermitage-debug
      - name: Upload debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermitage-debug
          path: debug/
          retention-days: 14
