name: Daily Air NZ fare check

on:
  schedule:
    # 台灣時間 05:15、17:15 開始（GitHub 排程常晚 10～20 分鐘，查詢約 15 分鐘），
    # 信件約在 06:00、18:00 寄達。cron 用 UTC：台灣 = UTC+8
    - cron: "15 21 * * *"
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "只查前幾組日期（診斷用，空白=全部）"
        required: false
      dest:
        description: "目的地機場代碼（空白=ZQN 皇后鎮）"
        required: false
      test_email:
        description: "只寄一封測試信（不查票）"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Check fares
        env:
          LIMIT: ${{ inputs.limit }}
          DEST: ${{ inputs.dest }}
          TEST_EMAIL: ${{ inputs.test_email }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_fares.py
      - name: Upload results & debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fare-results
          path: |
            results/
            debug/
          retention-days: 14
